<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Tahoma, sans-serif">
  <rect width="900" height="600" fill="#f4f6f8"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f3a5f">
    Diagrama de flujo de información
  </text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#555">
    Sistema de Manejo de Propiedades y Alquileres
  </text>

  <!-- Definiciones (flechas) -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f3a5f"/>
    </marker>
  </defs>

  <!-- Usuario -->
  <g transform="translate(50, 110)">
    <ellipse cx="80" cy="40" rx="80" ry="35" fill="#fff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="80" y="38" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3a5f">Usuario</text>
    <text x="80" y="56" text-anchor="middle" font-size="12" fill="#555">(administrador)</text>
  </g>

  <!-- Navegador -->
  <g transform="translate(260, 110)">
    <rect width="180" height="70" rx="6" fill="#fff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3a5f">Navegador web</text>
    <text x="90" y="50" text-anchor="middle" font-size="11" fill="#555">HTML + formularios</text>
    <text x="90" y="64" text-anchor="middle" font-size="11" fill="#555">(index, propiedades…)</text>
  </g>

  <!-- Servidor PHP -->
  <g transform="translate(530, 110)">
    <rect width="180" height="70" rx="6" fill="#fff" stroke="#1f3a5f" stroke-width="2"/>
    <text x="90" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f3a5f">Servidor PHP</text>
    <text x="90" y="50" text-anchor="middle" font-size="11" fill="#555">Procesa la petición</text>
    <text x="90" y="64" text-anchor="middle" font-size="11" fill="#555">(propiedades.php, etc.)</text>
  </g>

  <!-- Base de datos PostgreSQL -->
  <g transform="translate(760, 90)">
    <!-- "Cilindro" -->
    <ellipse cx="60" cy="20" rx="60" ry="14" fill="#1f3a5f" stroke="#1f3a5f"/>
    <rect x="0" y="20" width="120" height="80" fill="#1f3a5f" stroke="#1f3a5f"/>
    <ellipse cx="60" cy="100" rx="60" ry="14" fill="#1f3a5f" stroke="#1f3a5f"/>
    <text x="60" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">PostgreSQL</text>
    <text x="60" y="78" text-anchor="middle" font-size="11" fill="#d8e1ec">alquileres</text>
  </g>

  <!-- Flechas entre componentes -->
  <!-- Usuario → Navegador -->
  <line x1="210" y1="150" x2="260" y2="145" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="140" text-anchor="middle" font-size="11" fill="#555">acciones</text>

  <!-- Navegador → Servidor (request) -->
  <line x1="440" y1="135" x2="530" y2="135" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="128" text-anchor="middle" font-size="11" fill="#555">HTTP POST/GET</text>

  <!-- Servidor → Navegador (response) -->
  <line x1="530" y1="160" x2="440" y2="160" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="485" y="175" text-anchor="middle" font-size="11" fill="#555">HTML generado</text>

  <!-- Servidor → PostgreSQL (SQL) -->
  <line x1="710" y1="135" x2="760" y2="135" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="735" y="128" text-anchor="middle" font-size="11" fill="#555">SQL</text>

  <!-- PostgreSQL → Servidor (datos) -->
  <line x1="760" y1="160" x2="710" y2="160" stroke="#1f3a5f" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="735" y="175" text-anchor="middle" font-size="11" fill="#555">filas</text>

  <!-- ===================== Casos de uso ===================== -->
  <text x="450" y="280" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3a5f">
    Flujos principales del sistema
  </text>

  <!-- Caso 1: Insertar -->
  <g transform="translate(40, 310)">
    <rect width="260" height="240" rx="8" fill="#fff" stroke="#27ae60" stroke-width="2"/>
    <rect width="260" height="32" rx="8" fill="#27ae60"/>
    <rect y="22" width="260" height="10" fill="#27ae60"/>
    <text x="130" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">1. INSERT (añadir)</text>

    <text x="14" y="58"  font-size="12" fill="#222">1. Usuario llena el formulario.</text>
    <text x="14" y="80"  font-size="12" fill="#222">2. Navegador envía POST.</text>
    <text x="14" y="102" font-size="12" fill="#222">3. PHP valida los datos.</text>
    <text x="14" y="124" font-size="12" fill="#222">4. PHP ejecuta INSERT INTO ...</text>
    <text x="14" y="146" font-size="12" fill="#222">5. PostgreSQL guarda la fila.</text>
    <text x="14" y="168" font-size="12" fill="#222">6. PHP redirige a la lista.</text>
    <text x="14" y="190" font-size="12" fill="#222">7. Usuario ve confirmación</text>
    <text x="14" y="206" font-size="12" fill="#222">   y el nuevo registro.</text>
  </g>

  <!-- Caso 2: Update -->
  <g transform="translate(320, 310)">
    <rect width="260" height="240" rx="8" fill="#fff" stroke="#2980b9" stroke-width="2"/>
    <rect width="260" height="32" rx="8" fill="#2980b9"/>
    <rect y="22" width="260" height="10" fill="#2980b9"/>
    <text x="130" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">2. UPDATE (editar)</text>

    <text x="14" y="58"  font-size="12" fill="#222">1. Usuario presiona "Editar".</text>
    <text x="14" y="80"  font-size="12" fill="#222">2. PHP carga el registro y lo</text>
    <text x="14" y="96"  font-size="12" fill="#222">   muestra en el formulario.</text>
    <text x="14" y="118" font-size="12" fill="#222">3. Usuario modifica y envía.</text>
    <text x="14" y="140" font-size="12" fill="#222">4. PHP ejecuta UPDATE ... WHERE id.</text>
    <text x="14" y="162" font-size="12" fill="#222">5. PostgreSQL aplica los cambios.</text>
    <text x="14" y="184" font-size="12" fill="#222">6. PHP redirige y muestra</text>
    <text x="14" y="200" font-size="12" fill="#222">   confirmación.</text>
  </g>

  <!-- Caso 3: Delete -->
  <g transform="translate(600, 310)">
    <rect width="260" height="240" rx="8" fill="#fff" stroke="#c0392b" stroke-width="2"/>
    <rect width="260" height="32" rx="8" fill="#c0392b"/>
    <rect y="22" width="260" height="10" fill="#c0392b"/>
    <text x="130" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">3. DELETE / SELECT</text>

    <text x="14" y="58"  font-size="12" fill="#222">DELETE:</text>
    <text x="14" y="76"  font-size="12" fill="#222">1. Usuario presiona "Eliminar".</text>
    <text x="14" y="92"  font-size="12" fill="#222">2. Confirma en el diálogo.</text>
    <text x="14" y="108" font-size="12" fill="#222">3. PHP ejecuta DELETE ... WHERE id.</text>
    <text x="14" y="124" font-size="12" fill="#222">4. PostgreSQL borra la fila.</text>

    <text x="14" y="152" font-size="12" fill="#222">SELECT (reporte):</text>
    <text x="14" y="170" font-size="12" fill="#222">1. Usuario abre reporte.php.</text>
    <text x="14" y="186" font-size="12" fill="#222">2. PHP ejecuta SELECT con JOIN.</text>
    <text x="14" y="202" font-size="12" fill="#222">3. Datos se muestran en tabla.</text>
  </g>

  <text x="450" y="585" text-anchor="middle" font-size="11" font-style="italic" fill="#666">
    Toda la comunicación con la base de datos pasa por PDO (PHP Data Objects) usando consultas preparadas.
  </text>
</svg>
